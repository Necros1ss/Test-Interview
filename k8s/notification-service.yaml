apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: techlab-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: techlab-notification-service:latest
        ports:
        - containerPort: 3004
        envFrom:
        - configMapRef:
            name: techlab-config
        - secretRef:
            name: techlab-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: techlab-ecommerce
spec:
  selector:
    app: notification-service
  ports:
  - port: 3004
    targetPort: 3004
