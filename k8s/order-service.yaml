apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: techlab-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: techlab-order-service:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: techlab-config
        - secretRef:
            name: techlab-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: techlab-ecommerce
spec:
  selector:
    app: order-service
  ports:
  - port: 3001
    targetPort: 3001
