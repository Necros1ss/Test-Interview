apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: techlab-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: techlab-analytics-service:latest
        ports:
        - containerPort: 3005
        envFrom:
        - configMapRef:
            name: techlab-config
        - secretRef:
            name: techlab-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: techlab-ecommerce
spec:
  selector:
    app: analytics-service
  ports:
  - port: 3005
    targetPort: 3005
