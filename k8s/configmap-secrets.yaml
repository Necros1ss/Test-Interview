apiVersion: v1
kind: ConfigMap
metadata:
  name: techlab-config
  namespace: techlab-ecommerce
data:
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/techlab_db"
  API_GATEWAY_PORT: "3000"
  ORDER_SERVICE_URL: "http://order-service:3001"
  PAYMENT_SERVICE_URL: "http://payment-service:3002"
  INVENTORY_SERVICE_URL: "http://inventory-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3005"
  RATE_LIMIT_MAX_REQUESTS: "2000"
---
apiVersion: v1
kind: Secret
metadata:
  name: techlab-secrets
  namespace: techlab-ecommerce
type: Opaque
stringData:
  API_AUTH_TOKEN: "techlab-secret-token-2026"
  POSTGRES_PASSWORD: "postgres"
